<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест когнитивной сложности</title>
<style>*{margin:0;padding:0;box-sizing:border-box}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">

var SHEET_URL = 'https://script.google.com/macros/s/AKfycbyYEzsuLDdfoinF46ajO4DN-wRWPW7Cs3eVZ0ljtGLkeh72VnAFZF8AGn7UmtLuGakw/exec';

const{useState,useEffect,useRef}=React;

const mkG=n=>Array.from({length:n},()=>Array(n).fill(0));
const P5=s=>s.replace(/\s/g,'').match(/.{5}/g).map(r=>r.split('').map(Number));
const P6=s=>s.replace(/\s/g,'').match(/.{6}/g).map(r=>r.split('').map(Number));
const P7=s=>s.replace(/\s/g,'').match(/.{7}/g).map(r=>r.split('').map(Number));
const eq=(a,b)=>a.every((row,r)=>row.every((v,c)=>v===b[r][c]));
const cnt=g=>g.flat().reduce((s,v)=>s+v,0);

function tShiftR(g,n,sz){return g.map(r=>{const a=Array(sz).fill(0);r.forEach((v,c)=>{if(v)a[(c+n)%sz]=1});return a})}
function tCrossExplode(g,sz){const a=mkG(sz);g.forEach((r,ri)=>r.forEach((v,ci)=>{if(v){if(ri>0)a[ri-1][ci]=1;if(ri<sz-1)a[ri+1][ci]=1;if(ci>0)a[ri][ci-1]=1;if(ci<sz-1)a[ri][ci+1]=1;}}));return a;}
function tAsymExplode(g,sz){const a=mkG(sz);g.forEach((r,ri)=>r.forEach((v,ci)=>{if(v){if(ci<sz-1)a[ri][ci+1]=1;if(ri<sz-1)a[ri+1][ci]=1;}}));return a;}
function tKnight(g,dr,dc,sz){const a=mkG(sz);g.forEach((r,ri)=>r.forEach((v,ci)=>{if(v){const nr=ri+dr,nc=ci+dc;if(nr>=0&&nr<sz&&nc>=0&&nc<sz)a[nr][nc]=1;}}));return a;}
function tKnightWrap(g,dr,dc,sz){const a=mkG(sz);g.forEach((r,ri)=>r.forEach((v,ci)=>{if(v){const nr=((ri+dr)%sz+sz)%sz,nc=((ci+dc)%sz+sz)%sz;a[nr][nc]=1;}}));return a;}
function tConditional(g,sz){const a=mkG(sz);g.forEach((r,ri)=>r.forEach((v,ci)=>{if(v){const edge=ri===0||ri===sz-1||ci===0||ci===sz-1;if(edge){if(ri>0&&ci>0)a[ri-1][ci-1]=1;if(ri>0&&ci<sz-1)a[ri-1][ci+1]=1;if(ri<sz-1&&ci>0)a[ri+1][ci-1]=1;if(ri<sz-1&&ci<sz-1)a[ri+1][ci+1]=1;}else{a[ri-1][ci]=1;a[ri+1][ci]=1;a[ri][ci-1]=1;a[ri][ci+1]=1;}}}));return a;}

function randGrid(density,sz){const pos=[];for(let r=0;r<sz;r++)for(let c=0;c<sz;c++)pos.push([r,c]);for(let i=pos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]];}const g=mkG(sz);for(let i=0;i<Math.min(density,sz*sz);i++)g[pos[i][0]][pos[i][1]]=1;return g;}

const blocks=[
  {sz:5,numQ:2,startD:3,maxD:10,tf:g=>tShiftR(g,1,5),rI:P5('00000 01001 00000 10010 00000')},
  {sz:5,numQ:2,startD:2,maxD:7,tf:g=>tCrossExplode(g,5),rI:P5('00000 01010 00000 00010 00000')},
  {sz:5,numQ:2,startD:3,maxD:8,tf:g=>tAsymExplode(g,5),rI:P5('00000 01010 00000 01000 00000')},
  {sz:6,numQ:3,startD:3,maxD:10,tf:g=>tKnight(g,2,1,6),rI:P6('100100 010000 000000 000000 000000 000000')},
  {sz:6,numQ:4,startD:3,maxD:12,tf:g=>tKnightWrap(g,2,1,6),rI:P6('100010 000000 000000 000000 000010 000000')},
  {sz:7,numQ:5,startD:3,maxD:10,tf:g=>tConditional(g,7),rI:P7('0001000 0100000 0000000 0001000 0000000 0000010 0010000')},
];
blocks.forEach(b=>{b.rO=b.tf(b.rI)});
const totalQ=blocks.reduce((s,b)=>s+b.numQ,0);

const lvInfo={
  1:{name:"Конкретные операции",desc:"Работа с отдельными элементами по одному. Применение простых правил к малому количеству объектов.",work:"Исполнение чётко определённых задач, работа по инструкции."},
  2:{name:"Упорядоченные системы",desc:"Удержание правил при средней нагрузке. Отслеживание нелинейных трансформаций и нескольких элементов одновременно.",work:"Координация процессов, аналитика, работа с регламентами."},
  3:{name:"Системное мышление",desc:"Применение сложных правил в большом пространстве. Отслеживание переноса через границы, удержание правила при высокой плотности.",work:"Управление проектами, оптимизация процессов, архитектура решений."},
  4:{name:"Динамические системы",desc:"Одновременное удержание нескольких правил. Определение контекста для выбора правила. Параллельная обработка.",work:"Стратегическое управление, архитектура систем, трансформация организаций."},
};

function computeScores(results){
  var peaks=blocks.map(function(_,i){var br=results.filter(function(r){return r.bi===i&&r.correct});return br.length?Math.max.apply(null,br.map(function(r){return r.density})):0});
  var avgPeak=peaks.reduce(function(s,p){return s+p},0)/peaks.length;
  var lvl=1;if(avgPeak>=8)lvl=4;else if(avgPeak>=5)lvl=3;else if(avgPeak>=3)lvl=2;
  var maxPeak=Math.max.apply(null,peaks);
  var pot=lvl;if(maxPeak>=avgPeak+2&&lvl<4)pot=Math.min(lvl+1,4);
  var tot=results.filter(function(r){return r.correct}).length;
  var acc=tot/results.length;
  var logScore=acc>=0.8?4:acc>=0.6?3:acc>=0.4?2:1;
  var firstQs=blocks.map(function(_,i){return results.find(function(r){return r.bi===i})});
  var firstOk=firstQs.filter(function(r){return r&&r.correct}).length;
  var impr=0,fails=0;
  blocks.forEach(function(_,i){var br=results.filter(function(r){return r.bi===i});if(br.length>=2&&!br[0].correct){fails++;if(br.slice(1).some(function(r){return r.correct}))impr++;}});
  var learnPct=(firstOk/blocks.length+(fails>0?impr/fails:1))/2;
  var learnScore=learnPct>=0.8?4:learnPct>=0.6?3:learnPct>=0.4?2:1;
  var avgTpD=results.reduce(function(s,r){return s+r.time/Math.max(r.density,1)},0)/results.length;
  var spdScore=avgTpD<=3?4:avgTpD<=5?3:avgTpD<=8?2:1;
  return{lvl:lvl,pot:pot,tot:tot,logScore:logScore,learnScore:learnScore,spdScore:spdScore,avgPeak:Math.round(avgPeak*10)/10};
}

function Grid({data,interactive,userGrid,onToggle,showResult,answer,sz,cellSize}){
  const cs=cellSize||(sz<=5?38:sz<=6?34:30);
  return(<div style={{display:'inline-grid',gridTemplateColumns:'repeat('+sz+','+cs+'px)',border:'2px solid #333',width:'fit-content'}}>
    {Array.from({length:sz*sz},function(_,i){
      const r=Math.floor(i/sz),c=i%sz;
      const light=(r+c)%2===0;
      const base=light?'#e8e8e8':'#bfbfbf';
      const val=interactive?(userGrid&&userGrid[r]?userGrid[r][c]||0:0):(data&&data[r]?data[r][c]||0:0);
      const uv=userGrid&&userGrid[r]?userGrid[r][c]||0:0;
      const av=answer&&answer[r]?answer[r][c]||0:0;
      let bg=val?'#1a1a1a':base;
      if(showResult){if(av&&uv)bg='#16a34a';else if(uv&&!av)bg='#dc2626';else if(!uv&&av)bg='#4ade80';else bg=base;}
      return(<div key={i} onClick={function(){if(interactive&&!showResult&&onToggle)onToggle(r,c)}} style={{
        width:cs,height:cs,background:bg,
        borderRight:c<sz-1?'1px solid #999':'none',
        borderBottom:r<sz-1?'1px solid #999':'none',
        cursor:interactive&&!showResult?'pointer':'default',
        boxSizing:'border-box',
      }}/>);
    })}
  </div>);
}

function CognitiveTest(){
  const[phase,setPhase]=useState('start');
  const[name,setName]=useState('');
  const[bi,setBi]=useState(0);
  const[qib,setQib]=useState(0);
  const[tQ,setTQ]=useState(0);
  const[density,setDensity]=useState(3);
  const[quest,setQuest]=useState(null);
  const[ug,setUg]=useState([]);
  const[checked,setChecked]=useState(false);
  const[results,setResults]=useState([]);
  const[t0,setT0]=useState(null);
  const[elapsed,setElapsed]=useState(0);
  const[qS,setQS]=useState(null);
  const[mks,setMks]=useState(0);
  const[umks,setUmks]=useState(0);
  const[fc,setFc]=useState(null);
  const[sent,setSent]=useState(false);
  const tmr=useRef(null);

  useEffect(function(){if(phase==='test'&&t0){tmr.current=setInterval(function(){setElapsed(Math.floor((Date.now()-t0)/1000))},1000);return function(){clearInterval(tmr.current)};}},[phase,t0]);

  // Auto-save to Google Sheets
  useEffect(function(){
    if(phase==='result'&&results.length>0&&!sent){
      setSent(true);
      try{
        var sc=computeScores(results);
        if(SHEET_URL){
          fetch(SHEET_URL,{
            method:'POST',
            mode:'no-cors',
            body:JSON.stringify({
              name:name,elapsed:elapsed,correct:sc.tot,total:results.length,
              level:sc.lvl,potential:sc.pot,logScore:sc.logScore,
              learnScore:sc.learnScore,speedScore:sc.spdScore,avgPeak:sc.avgPeak,
              questions:results
            })
          }).catch(function(){});
        }
      }catch(e){}
    }
  },[phase,sent]);

  const genQ=function(bIdx,d){const b=blocks[bIdx];const qi=randGrid(d,b.sz);return{qi:qi,answer:b.tf(qi),density:d}};

  const go=function(){
    if(!name.trim())return;
    blocks.forEach(function(b){b.rO=b.tf(b.rI)});
    const d=blocks[0].startD;const q=genQ(0,d);
    setPhase('test');setT0(Date.now());setQS(Date.now());setBi(0);setQib(0);setTQ(0);
    setDensity(d);setQuest(q);setResults([]);setUg(mkG(blocks[0].sz));
    setChecked(false);setMks(0);setUmks(0);setFc(null);setSent(false);
  };

  const tog=function(r,c){
    if(!fc)setFc(Date.now());
    if(ug[r]&&ug[r][c])setUmks(function(p){return p+1});else setMks(function(p){return p+1});
    setUg(function(p){const n=p.map(function(x){return x.slice()});n[r][c]=n[r][c]?0:1;return n});
  };

  const chk=function(){
    const ok=eq(ug,quest.answer);
    const time=Math.floor((Date.now()-qS)/1000);
    const ttfc=fc?Math.floor((fc-qS)/1000):time;
    setResults(function(p){return p.concat([{bi:bi,qib:qib,density:quest.density,correct:ok,time:time,marks:mks,unmarks:umks,firstClickSec:ttfc}])});
    setChecked(true);
  };

  const nxt=function(){
    const wasOk=results[results.length-1].correct;
    var nBi=bi,nQib=qib+1,nD=density;
    if(wasOk)nD=Math.min(nD+2,blocks[bi].maxD);else nD=Math.max(nD-1,2);
    if(nQib>=blocks[bi].numQ){nBi++;nQib=0;if(nBi<blocks.length)nD=blocks[nBi].startD;}
    if(nBi>=blocks.length){clearInterval(tmr.current);setPhase('result');return;}
    var q=genQ(nBi,nD);
    setBi(nBi);setQib(nQib);setTQ(tQ+1);setDensity(nD);setQuest(q);
    setUg(mkG(blocks[nBi].sz));setChecked(false);setQS(Date.now());setMks(0);setUmks(0);setFc(null);
  };

  const fmt=function(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  const F="'Segoe UI',system-ui,sans-serif";

  if(phase==='start')return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a,#1e293b)',fontFamily:F}}>
      <div style={{maxWidth:500,padding:36,background:'#fff',borderRadius:8,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <h1 style={{fontSize:24,color:'#0f172a',margin:'0 0 8px',fontWeight:700}}>Тест когнитивной сложности</h1>
        <p style={{color:'#555',fontSize:14,lineHeight:1.7,margin:'0 0 20px'}}>
          Вам покажут пары сеток. Слева — правило: как тёмные клетки трансформируются. Поймите правило и примените его к сетке справа, кликая по нужным клеткам.
          <br/><br/>18 вопросов · 6 правил · Сложность адаптируется · Работайте в своём темпе
        </p>
        <input value={name} onChange={function(e){setName(e.target.value)}} placeholder="Ваше имя" onKeyDown={function(e){if(e.key==='Enter')go()}}
          style={{width:'100%',padding:'12px 14px',fontSize:15,border:'2px solid #ddd',borderRadius:4,marginBottom:16,outline:'none',boxSizing:'border-box',fontFamily:F}}/>
        <button onClick={go} style={{width:'100%',padding:'13px 0',fontSize:16,fontWeight:600,
          background:name.trim()?'#0f172a':'#999',color:'#fff',border:'none',borderRadius:4,cursor:name.trim()?'pointer':'not-allowed',fontFamily:F}}>Начать</button>
      </div>
    </div>
  );

  if(phase==='result'){
    var sc=computeScores(results);
    return(
      <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#0f172a,#1e293b)',fontFamily:F}}>
        <div style={{maxWidth:560,padding:36,background:'#fff',borderRadius:8,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
          <div style={{fontSize:11,color:'#999',marginBottom:4,letterSpacing:1}}>ADAPTIVE REASONING ASSESSMENT</div>
          <h1 style={{fontSize:22,color:'#0f172a',margin:'0 0 2px',fontWeight:700}}>{'Отчёт: '+name}</h1>
          <p style={{color:'#666',margin:'0 0 24px',fontSize:13}}>
            {new Date().toLocaleDateString('ru-RU')+' · Время: '+fmt(elapsed)+' · Правильных: '+sc.tot+'/'+results.length}
          </p>
          <div style={{fontSize:14,fontWeight:700,color:'#0f172a',marginBottom:12,borderBottom:'2px solid #eee',paddingBottom:6}}>1. Когнитивная сложность</div>
          <p style={{color:'#666',fontSize:13,lineHeight:1.6,margin:'0 0 16px'}}>Когнитивная сложность — масштаб информации, с которым вы эффективно работаете.</p>
          <div style={{padding:18,background:'#f0f7ff',borderRadius:6,border:'1px solid #b3d4fc',marginBottom:12}}>
            <div style={{fontSize:11,color:'#1a5fb4',fontWeight:600,marginBottom:6}}>ТЕКУЩИЙ УРОВЕНЬ</div>
            <div style={{fontSize:20,fontWeight:700,color:'#0f172a',marginBottom:4}}>{lvInfo[sc.lvl].name}</div>
            <div style={{fontSize:13,color:'#333',lineHeight:1.6,marginBottom:6}}>{lvInfo[sc.lvl].desc}</div>
            <div style={{fontSize:12,color:'#666',fontStyle:'italic'}}>{lvInfo[sc.lvl].work}</div>
          </div>
          {sc.pot>sc.lvl&&(<div style={{padding:18,background:'#fef9e7',borderRadius:6,border:'1px solid #e6d560',marginBottom:12}}>
            <div style={{fontSize:11,color:'#8a6d0b',fontWeight:600,marginBottom:6}}>ПОТЕНЦИАЛ</div>
            <div style={{fontSize:18,fontWeight:600,color:'#0f172a',marginBottom:4}}>{lvInfo[sc.pot].name}</div>
            <div style={{fontSize:13,color:'#333',lineHeight:1.6}}>{lvInfo[sc.pot].desc}</div>
          </div>)}
          <div style={{fontSize:14,fontWeight:700,color:'#0f172a',marginBottom:12,marginTop:24,borderBottom:'2px solid #eee',paddingBottom:6}}>2. Навыки когнитивной обработки</div>
          {[{label:'Логико-аналитический',score:sc.logScore,desc:'Точность вычленения, переноса и применения правил'},
            {label:'Обучаемость',score:sc.learnScore,desc:'Гибкость, скорость усвоения новых правил'},
            {label:'Скорость',score:sc.spdScore,desc:'Темп решения незнакомых задач'}
          ].map(function(s){return(<div key={s.label} style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:600,color:'#0f172a',marginBottom:2}}>{s.label}</div>
            <div style={{fontSize:11,color:'#888',marginBottom:6}}>{s.desc}</div>
            <div style={{display:'flex',gap:2}}>{[1,2,3,4].map(function(v){return(<div key={v} style={{flex:1,height:28,background:v<=s.score?'#0f172a':'#e5e5e5',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:v<=s.score?'#fff':'#aaa',fontWeight:600}}>{v}</div>)})}</div>
          </div>)})}
          <div style={{fontSize:14,fontWeight:700,color:'#0f172a',marginBottom:12,marginTop:24,borderBottom:'2px solid #eee',paddingBottom:6}}>3. Описание конструктов</div>
          <div style={{fontSize:12,color:'#666',lineHeight:1.7}}>
            <p style={{margin:'0 0 10px'}}><b style={{color:'#333'}}>Логико-аналитический</b> — точный, детальный подход; систематическая работа; внимание к правилам; анализ и сравнение элементов; выявление связей; логическая проверка выводов.</p>
            <p style={{margin:'0 0 10px'}}><b style={{color:'#333'}}>Обучаемость</b> — любознательность; адаптивность и гибкость; усвоение новых правил и перспектив; способность учиться на обратной связи.</p>
            <p style={{margin:'0 0 10px'}}><b style={{color:'#333'}}>Скорость</b> — общий темп решения новых и незнакомых задач.</p>
          </div>
          <div style={{padding:14,background:'#fffbe6',border:'1px solid #e6d560',fontSize:12,color:'#7a6400',lineHeight:1.6,marginTop:20}}>Тест использует визуальные (невербальные) задания и может занижать результаты людей с вербальным типом обработки. Результаты рекомендуется интерпретировать совместно с экспертной оценкой руководителя.</div>
          <button onClick={function(){setPhase('start');setName('');}} style={{width:'100%',marginTop:16,padding:'12px 0',fontSize:14,fontWeight:600,background:'#0f172a',color:'#fff',border:'none',borderRadius:4,cursor:'pointer',fontFamily:F}}>Пройти заново</button>
        </div>
      </div>
    );
  }

  if(!quest)return null;
  const block=blocks[bi];const ok=checked&&eq(ug,quest.answer);const hasDark=cnt(ug)>0;
  return(
    <div style={{minHeight:'100vh',background:'#e0e0e0',fontFamily:F}}>
      <div style={{background:'#0f172a',color:'#fff',padding:'10px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13}}>
        <span>{'Вопрос '+(tQ+1)+' из '+totalQ}</span><span>{fmt(elapsed)}</span>
      </div>
      <div style={{height:4,background:'#ccc'}}><div style={{height:'100%',width:((tQ+(checked?1:0))/totalQ*100)+'%',background:'#16a34a',transition:'width 0.3s'}}/></div>
      <div style={{padding:'8px 20px',background:'#333',color:'#ccc',fontSize:12}}>Изучите правило (БЫЛО → СТАЛО). Примените его к сетке справа.</div>
      <div style={{display:'flex',gap:16,padding:16,justifyContent:'center',flexWrap:'wrap',alignItems:'flex-start'}}>
        <div style={{background:'#f5f5f0',borderRadius:6,padding:14,boxShadow:'0 2px 8px rgba(0,0,0,0.1)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#0f172a',marginBottom:8}}>ПРАВИЛО</div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <div><div style={{fontSize:10,color:'#666',marginBottom:3,fontWeight:600}}>БЫЛО</div><Grid data={block.rI} sz={block.sz}/></div>
            <div style={{fontSize:20,color:'#999',marginTop:12}}>→</div>
            <div><div style={{fontSize:10,color:'#666',marginBottom:3,fontWeight:600}}>СТАЛО</div><Grid data={block.rO} sz={block.sz}/></div>
          </div>
        </div>
        <div style={{background:checked?(ok?'#e8f5e9':'#fbe9e7'):'#e3f2fd',borderRadius:6,padding:14,boxShadow:'0 2px 8px rgba(0,0,0,0.1)',border:'2px solid '+(checked?(ok?'#66bb6a':'#ef5350'):'#64b5f6')}}>
          <div style={{fontSize:13,fontWeight:700,color:'#0f172a',marginBottom:8}}>{'ВОПРОС '+(tQ+1)}</div>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <div><div style={{fontSize:10,color:'#666',marginBottom:3,fontWeight:600}}>ДАНО</div><Grid data={quest.qi} sz={block.sz}/></div>
            <div style={{fontSize:20,color:'#999',marginTop:12}}>→</div>
            <div><div style={{fontSize:10,color:'#666',marginBottom:3,fontWeight:600}}>{checked?'ОТВЕТ':'ВАШ ОТВЕТ'}</div>
              <Grid interactive={true} userGrid={ug} onToggle={tog} showResult={checked} answer={quest.answer} sz={block.sz}/></div>
          </div>
          <div style={{marginTop:10,display:'flex',gap:8,alignItems:'center'}}>
            {!checked?(<button onClick={chk} disabled={!hasDark} style={{padding:'8px 22px',fontSize:13,fontWeight:600,background:hasDark?'#0f172a':'#bbb',color:'#fff',border:'none',borderRadius:4,cursor:hasDark?'pointer':'not-allowed',fontFamily:F}}>Проверить</button>
            ):(<React.Fragment><div style={{padding:'7px 12px',fontSize:13,fontWeight:600,background:ok?'#c8e6c9':'#ffcdd2',color:ok?'#2e7d32':'#c62828'}}>{ok?'✓ Верно':'✗ Неверно'}</div>
              <button onClick={nxt} style={{padding:'8px 22px',fontSize:13,fontWeight:600,background:'#0f172a',color:'#fff',border:'none',borderRadius:4,cursor:'pointer',fontFamily:F}}>{tQ+1>=totalQ?'Результаты':'Далее →'}</button></React.Fragment>)}
          </div>
        </div>
      </div>
      {checked&&<div style={{display:'flex',gap:14,justifyContent:'center',padding:'0 16px 16px',flexWrap:'wrap'}}>
        {[['#16a34a','Верно'],['#4ade80','Пропущено'],['#dc2626','Лишнее']].map(function(item){return(<div key={item[1]} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'#666'}}>
          <div style={{width:12,height:12,background:item[0]}}/>{item[1]}</div>)})}
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CognitiveTest/>);
</script>
</body>
</html>
